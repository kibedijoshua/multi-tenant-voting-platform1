name: Daily Status

on:
  schedule:
    # Runs daily at 20:00 UTC (adjust to your time zone as needed)
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "kibedijoshua"
          git config user.email "kibedijoshua7@gmail.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and commit daily status
        run: node scripts/daily-status-cloud.js

      - name: Push changes
        run: git push
        continue-on-error: true