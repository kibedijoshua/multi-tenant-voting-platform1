<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VoteSphere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/background.jpeg?v=1') center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(59, 130, 246, 0.15);
            z-index: -1;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.97);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .auth-card h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-card .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            margin-top: 5px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .message.error {
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .links {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .links a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-webfont/dist/lucide-font.css">
</head>
<body>
    <div class="auth-card">
        <img src="/logo.png" alt="VoteSphere" class="logo" onerror="this.style.display='none'">
        <h1>VoteSphere</h1>
        <p class="subtitle">Sign in to manage your voting sessions</p>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="Enter your username or email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group" id="mfaGroup" style="display: none;">
                <label for="mfaCode">Two-Factor Authentication Code</label>
                <input type="text" id="mfaCode" placeholder="000000" maxlength="6">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="links">
            <a href="/register">Create an account</a>
        </div>
        <div class="footer-note"><i class="lucide lucide-lock"></i> Secure voting platform</div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const mfaGroup = document.getElementById('mfaGroup');
        const mfaCode = document.getElementById('mfaCode');

        function showMessage(text, type) {
            message.className = 'message ' + type;
            message.textContent = text;
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.className = 'message';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, mfaCode: mfaCode.value || undefined })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('Login successful! Redirecting...', 'success');
                    window.location.href = '/';
                } else if (data.mfaRequired) {
                    mfaGroup.style.display = 'block';
                    mfaCode.focus();
                    showMessage(data.error || 'Enter your authentication code', 'error');
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('An error occurred. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
